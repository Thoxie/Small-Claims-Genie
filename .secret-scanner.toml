# Versioned configuration for scripts/scan-secrets.py, the project's
# dependency-free secret scanner. Keep rule definitions here rather than in
# hooks so every clone uses the same policy.

[scanner]
version = 1

[allowlist]
# The rule expressions themselves are not secrets.
path_globs = [".secret-scanner.toml"]
# These values are conventional local/example database passwords, not live
# credentials. Any other password embedded in a PostgreSQL URL is blocked.
postgres_password_fragments = [
  "postgres",
  "password",
  "example",
  "replace",
  "your",
  "changeme",
  "placeholder",
]
# A Compose database may use a disposable password inside its isolated network.
# This exception is intentionally limited to standard local service hosts.
postgres_local_hosts = ["localhost", "127.0.0.1", "postgres", "db", "database"]

[[rules]]
id = "anthropic-api-key"
regex = '\bsk-ant-api[A-Za-z0-9_-]{12,}\b'

[[rules]]
id = "openai-project-key"
regex = '\bsk-proj-[A-Za-z0-9_-]{12,}\b'

[[rules]]
id = "stripe-secret-key"
regex = '\bsk_(?:live|test)_[A-Za-z0-9_-]{16,}\b'

[[rules]]
id = "stripe-webhook-secret"
regex = '\bwhsec_[A-Za-z0-9_-]{16,}\b'

[[rules]]
id = "stripe-live-publishable-key"
regex = '\bpk_live_[A-Za-z0-9_-]{16,}\b'

[[rules]]
id = "github-classic-token"
regex = '\bghp_[A-Za-z0-9]{36,}\b'

[[rules]]
id = "github-fine-grained-token"
regex = '\bgithub_pat_[A-Za-z0-9_]{20,}\b'

[[rules]]
id = "aws-access-key"
regex = '\bAKIA[0-9A-Z]{16}\b'

[[rules]]
id = "private-key"
regex = '-----BEGIN [A-Z ]*PRIVATE KEY-----'

[[rules]]
id = "jwt"
regex = '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'

[[rules]]
id = "postgres-url-with-password"
regex = '(?i)\bpostgres(?:ql)?://[^:/\s]+:[^@\s]+@[^/\s]+'